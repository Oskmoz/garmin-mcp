services:
  garmin-mcp:
    build: .
    container_name: garmin-mcp
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.garmin-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.garmin-mcp.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.garmin-mcp.tls=true
      - traefik.http.routers.garmin-mcp.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.garmin-mcp.loadbalancer.server.port=8000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
